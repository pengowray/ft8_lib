<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VK3PGO FT8 Player</title>
    <link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #333333;
            --input-bg: #f0f0f0;
            --button-bg: #4CAF50;
            --button-text: #ffffff;

            --error-text: #aa0000;
            --warning-text: rgb(181, 112, 0);

            --position-line-color: red;
            --costas-bg: #a9a9a9;
            --data-bg: #737373;
            --ramp-bg: #d0d0d0;
        }

        .dark-mode {
            --bg-color: #222222;
            --text-color: #f0f0f0;
            --input-bg: #444444;
            --button-bg: #45a049;
            --button-text: #ffffff;

            --error-text: #ff0000;
            --warning-text: orange;

            --position-line-color: white;
            --costas-bg: #545454;
            --data-bg: #1f1f1f;
            --ramp-bg: #333333;

            --link-color: #61dafb;
            --link-hover-color: #a8e9ff;
            --link-visited-color: #bb86fc;
        }

        body {
            font-family: 'Jost', 'Segoe UI', 'Roboto', 'Helvetica Neue', 'Arial', 'Noto Sans', sans-serif, 'Segoe UI Emoji', 'Segoe UI Symbol', 'Noto Color Emoji', 'Apple Color Emoji';
            line-height: 1.6;
            color: var(--text-color);
            background-color: var(--bg-color);
            padding: 20px;
            transition: all 0.3s ease;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        h1, h2 {
            text-align: center;
        }

        .dark-mode a {
            color: var(--link-color);
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .dark-mode a:hover {
            color: var(--link-hover-color);
            text-decoration: underline;
        }

        .dark-mode a:visited {
            color: var(--link-visited-color);
        }

        .btn {
          height: 40px;
          padding: 0 15px;
          border-radius: 4px;
          font-size: 14px;
          display: inline-flex;
          align-items: center;
          justify-content: center;
        }

        input[type="text"], input[type="file"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            background-color: var(--input-bg);
            border: 1px solid var(--text-color);
            color: var(--text-color);
        }

        button {
            background-color: var(--button-bg);
            color: var(--button-text);
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        #visualization-caption {
            color: gray;
            font-size: 0.7em;
        }

        button:hover {
            opacity: 0.9;
        }

        .input-group {
          display: flex;
          align-items: stretch;
        }

        #message-input {
          flex-grow: 1;
          height: 40px;
          padding: 0 10px;
          border-radius: 4px 0 0 4px;
        }

        #encode-button {
          border-radius: 0 4px 4px 0;
        }
/*
        .input-group input[type="text"] {
            flex-grow: 1;
            margin-right: 10px;
        }
*/

        #theme-toggle {
          position: fixed;
          top: 10px;
          right: 10px;
          background: none;
          border: none;
          font-size: 24px;
          cursor: pointer;
          opacity: 0.7;
        }

        #theme-toggle:hover {
          opacity: 1;
        }

        #toggle-settings {
          background: none;
          border: none;
          color: var(--text-color);
          opacity: 0.7;
          font-size: 14px;
          padding: 5px 0;
          cursor: pointer;
          text-decoration: underline;
        }

        #audio-controls {
          display: flex;
          flex-wrap: wrap;
          gap: 10px;
          margin-top: 15px;
        }

        @media (max-width: 600px) {
          #audio-controls {
            flex-direction: column;
          }
          
          #audio-controls .btn {
            width: 100%;
          }
        }
        .settings-toggle {
            margin-bottom: 10px;
        }

        #audio-settings {
            background-color: var(--input-bg);
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 10px;
        }

        #audio-settings.hidden {
            display: none;
        }

        .setting-group {
            display: flex;
            align-items: center;
            margin-bottom: 5px;
        }

        .setting-group label {
            min-width: 150px;
            margin-right: 10px;
        }

        #base-freq-input, #sample-rate-select {
            flex-grow: 1;
        }

        #toggle-settings {
            background-color: var(--button-bg);
            color: var(--button-text);
            border: none;
            padding: 5px 10px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        #toggle-settings:hover {
            opacity: 0.9;
        }

        #encode-output, #decode-output, #output {
            background-color: var(--input-bg);
            padding: 10px;
            margin-top: 10px;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        #error-output {
            background-color: var(--input-bg);
            color: var(--error-text);
        }
        
        .warning {
            color: var(--warning-text);
        }

        #example-messages {
            margin-top: 20px;
        }

        #example-messages button {
            margin-right: 10px;
            margin-bottom: 10px;
        }

        #audio-controls {
            margin-top: 20px;
        }

        #audio-controls button {
            margin-right: 10px;
        }

        #theme-toggle {
            position: absolute;
            top: 10px;
            right: 10px;
        }

        #piano-roll {
            margin-top: 20px;
            display: grid;
            gap: 1px;
            height: 100px;
            position: relative;
            background-color: var(--bg-color);
        }

        #piano-roll div {
            transition: background-color 0.1s;
        }

        #position-line {
            position: absolute;
            width: 2px;
            height: 100%;
            background-color: red;
            transition: left 0.1s;
        }

        body.dark-mode #piano-roll {
            background-color: #333;
        }

        body:not(.dark-mode) #piano-roll {
            background-color: #ddd;
        }

        #audio-visualization {
            margin-top: 20px;
        }
        #waveform-canvas {
            width: 100%;
            height: 200px;
            border: 1px solid #ccc;
        }
        #visualization-controls {
            margin-top: 10px;
        }
        #time-display {
            margin-left: 10px;
        }

        /* bits visualization */
        .bits-grid-container {
            display: grid;
            gap: 1px;
            font-family: monospace;
            overflow-x: auto;
            white-space: nowrap;
            padding: 10px;
        }
        
        .bit, .symbol, .packed, .annotation {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 2em;
            border: 1px solid var(--border-color);
            overflow: hidden;
            padding: 2px;
            font-size: 0.8em;
            text-align: center;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .annotations-row3 .annotation {
            border-bottom: none;
            margin-bottom: 0;
            /* border-radius: 4px 4px 0 0; */
        }

        .annotations-row4 .annotation {
            border-top: none;
            border-radius: 0 0 4px 4px;
            padding-top: 0;
            margin-top: 0;
        }

        .symbol {
            font-weight: bold;
        }
        
        .symbol.costas {
            background-color: var(--costas-bg);
            color: var(--packed-color);

        }
        
        .symbol.data {
            background-color: var(--data-bg);
            color: var(--packed-color);
        }
        
        .bit-one {
            background-color: var(--bit-one-bg);
            color: var(--packed-color);

        }
        
        .bit-zero {
            background-color: var(--bit-zero-bg);
            color: var(--packed-color);
        }
        
        .packed {
            background-color: var(--packed-bg);
            color: var(--packed-color);
        }
        
        .annotation {
            background-color: var(--annotation-bg);
            color: var(--annotation-color);
            font-size: 0.8em;
        }
        
        .highlighted {
            outline: 2px solid var(--highlight-color);
            z-index: 1;
        }
        
        .toggle-container {
            margin-bottom: 10px;
        }
        
        .toggle-container button {
            margin-right: 10px;
        }
        
        /* Dark mode */
        @media (prefers-color-scheme: dark) {
            :root {
                --border-color: #555;
                --costas-bg: #2c3e50;
                --data-bg: #34495e;
                --bit-one-bg: #27ae60;
                --bit-zero-bg: #c0392b;
                --packed-bg: #7f8c8d;
                --packed-color: #ecf0f1;
                --annotation-bg: #8e44ad;
                --annotation-color: #ecf0f1;
                --highlight-color: #f39c12;
            }
        }
        
        /* Light mode */
        @media (prefers-color-scheme: light) {
            :root {
                --border-color: #ccc;
                --costas-bg: #bdc3c7;
                --data-bg: #ecf0f1;
                --bit-one-bg: #2ecc71;
                --bit-zero-bg: #e74c3c;
                --packed-bg: #95a5a6;
                --packed-color: #2c3e50;
                --annotation-bg: #9b59b6;
                --annotation-color: #ffffff;
                --highlight-color: #f39c12;
            }
        }
        
        /* end of bits visualization */

        @media (max-width: 600px) {
            body {
                padding: 10px;
            }

            button {
                width: 100%;
                margin-bottom: 10px;
            }

            #theme-toggle {
                position: static;
                display: block;
                margin-bottom: 20px;
            }
        }
    </style>
</head>
<body class="dark-mode">
<div class="container">
    <button id="theme-toggle" aria-label="Toggle Dark Mode">🌓</button>

    <h2>VK3PGO FT8 Player</h2>
    
    <div class="input-group">
      <input type="text" id="message-input" placeholder="Enter message to encode">
      <button id="encode-button" class="btn">Encode</button>
    </div>

    <div id="error-output"></div>
    
    <div class="settings-toggle">
        <button id="toggle-settings">Audio Settings ▼</button>
    </div>

    <div id="audio-settings" class="hidden">
        <div class="setting-group">
            <label for="base-freq-input">Base Frequency (Hz):</label>
            <input type="text" id="base-freq-input" placeholder="for example 500 or A4" value="500">
        </div>
        <div class="setting-group">
            <label for="sample-rate-select">Sample Rate:</label>
            <select id="sample-rate-select"></select>
        </div>
    </div>

    <div id="audio-controls">
      <button id="play-audio" class="btn">Play Audio</button>
      <button id="play-audio-timed" class="btn">Play Next 15s Slot</button>
      <button id="stop-audio" class="btn" disabled>Stop Audio</button>
      <button id="download-audio" class="btn">Download Audio</button>
      <div id="countdown"></div>
    </div>

    <div id="piano-roll" style="margin-top: 20px;"></div>
    <div id="audio-visualization" height="200">
        <canvas id="waveform-canvas"></canvas>
        <div id="visualization-caption"></div>
        <div id="visualization-controls">
            <button id="toggle-visualization">Change Visualization</button>
            <span id="time-display">0.00 / 0.00</span>
        </div>
    </div>

    <div id="tribble-visualization" style="margin-top: 20px;"></div>

    <div id="output"></div>

    <div id="example-messages">
        <h3>Example Messages:</h3>
    </div>

    <div id="test-inputs">
        <label for="test-select">Test Inputs:</label>
        <select id="test-select">
            <option value="">Select a test input</option>
        </select>
    </div>

    <div style="text-align: center;">
        <br>

        <a href="https://github.com/pengowray/ft8play">
        <img src="https://img.shields.io/badge/View%20on-GitHub-brightgreen" alt="View on GitHub">
        </a>
        <br>
        Created by Pengo Wray.

    </div>

    <div style="display: none;">
        <h2>Decoder</h2>
        <input type="file" id="audio-input" accept=".wav">
        <button id="decode-button">Decode</button>
        <div id="decode-output"></div>
    </div>
</div>

<script src="https://d3js.org/d3.v7.min.js"></script>
<script src="ft8_wasm.js"></script>
<script src="ft8_extra.js"></script>
<script src="ft8_msg.js"></script>
<script src="views.js"></script>
<script src="views_viz.js"></script>
<script src="views_piano.js"></script>
<script src="views_output.js"></script>
<script src="views_bits.js"></script>
<script src="ft8_tests.js"></script>
<script src="main.js" defer></script>
<script>
    
document.addEventListener('DOMContentLoaded', () => {
    initializeUI(); // main.js
});
</script>
</body>
</html>
